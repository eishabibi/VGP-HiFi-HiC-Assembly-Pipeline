<svg width="100%" viewBox="0 0 680 1120" xmlns="http://www.w3.org/2000/svg">
<title>VGP Hi-C Phased Assembly Pipeline</title>
<desc>Streamlined workflow for genome assembly using HiFi and Hi-C data</desc>

<style>
  .node { cursor: pointer; }
  .node:hover { opacity: 0.8; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
  .ts { font-size: 12px; fill: #5f5e5a; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  
  /* Color classes */
  .c-gray rect { fill: #f1efe8; stroke: #5f5e5a; }
  .c-gray .th { fill: #2c2c2a; }
  .c-gray .ts { fill: #5f5e5a; }
  
  .c-teal rect { fill: #e1f5ee; stroke: #0f6e56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0f6e56; }
  
  .c-blue rect { fill: #e6f1fb; stroke: #185fa5; }
  .c-blue .th { fill: #0c447c; }
  .c-blue .ts { fill: #185fa5; }
  
  .c-purple rect { fill: #eeedfe; stroke: #534ab7; }
  .c-purple .th { fill: #3c3489; }
  .c-purple .ts { fill: #534ab7; }
  
  .c-green rect { fill: #eaf3de; stroke: #3b6d11; }
  .c-green .th { fill: #27500a; }
  .c-green .ts { fill: #3b6d11; }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- START -->
<g class="node c-gray">
<rect x="250" y="30" width="180" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Upload Data to Galaxy</text>
</g>

<line x1="340" y1="74" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 1: DATA INPUT -->
<g class="node c-teal">
<rect x="250" y="108" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="126" text-anchor="middle" dominant-baseline="central">Input Data</text>
<text class="ts" x="340" y="144" text-anchor="middle" dominant-baseline="central">3 HiFi files + 2 Hi-C files</text>
</g>

<line x1="340" y1="164" x2="340" y2="198" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 2: ORGANIZE COLLECTIONS -->
<g class="node c-teal">
<rect x="250" y="198" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="216" text-anchor="middle" dominant-baseline="central">Organize Collections</text>
<text class="ts" x="340" y="234" text-anchor="middle" dominant-baseline="central">Create HiFi collection</text>
</g>

<line x1="340" y1="254" x2="340" y2="288" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 3: CUTADAPT -->
<g class="node c-teal">
<rect x="250" y="288" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="306" text-anchor="middle" dominant-baseline="central">Cutadapt</text>
<text class="ts" x="340" y="324" text-anchor="middle" dominant-baseline="central">Remove adapter sequences</text>
</g>

<line x1="340" y1="344" x2="340" y2="378" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 4: MERYL -->
<g class="node c-blue">
<rect x="250" y="378" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="396" text-anchor="middle" dominant-baseline="central">Meryl</text>
<text class="ts" x="340" y="414" text-anchor="middle" dominant-baseline="central">K-mer counting (k=31)</text>
</g>

<line x1="340" y1="434" x2="340" y2="468" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 5: GENOMESCOPE2 -->
<g class="node c-blue">
<rect x="250" y="468" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="486" text-anchor="middle" dominant-baseline="central">GenomeScope2</text>
<text class="ts" x="340" y="504" text-anchor="middle" dominant-baseline="central">Genome size estimation</text>
</g>

<line x1="340" y1="524" x2="340" y2="558" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 6: HIFIASM HI-C PHASED -->
<g class="node c-purple">
<rect x="250" y="558" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="576" text-anchor="middle" dominant-baseline="central">Hifiasm Hi-C Mode</text>
<text class="ts" x="340" y="594" text-anchor="middle" dominant-baseline="central">Generate Hap1 + Hap2</text>
</g>

<line x1="340" y1="614" x2="340" y2="648" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 7: GFA TO FASTA CONVERSION -->
<g class="node c-purple">
<rect x="250" y="648" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="666" text-anchor="middle" dominant-baseline="central">gfastats</text>
<text class="ts" x="340" y="684" text-anchor="middle" dominant-baseline="central">Convert GFA to FASTA</text>
</g>

<line x1="340" y1="704" x2="340" y2="738" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 8: QUALITY CONTROL - gfastats -->
<g class="node c-blue">
<rect x="250" y="738" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="756" text-anchor="middle" dominant-baseline="central">gfastats Stats</text>
<text class="ts" x="340" y="774" text-anchor="middle" dominant-baseline="central">N50, contigs, length</text>
</g>

<line x1="340" y1="794" x2="340" y2="828" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 9: BUSCO -->
<g class="node c-blue">
<rect x="250" y="828" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="846" text-anchor="middle" dominant-baseline="central">BUSCO</text>
<text class="ts" x="340" y="864" text-anchor="middle" dominant-baseline="central">Genome completeness</text>
</g>

<line x1="340" y1="884" x2="340" y2="918" class="arr" marker-end="url(#arrow)"/>

<!-- STEP 10: MERQURY -->
<g class="node c-blue">
<rect x="250" y="918" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="936" text-anchor="middle" dominant-baseline="central">Merqury</text>
<text class="ts" x="340" y="954" text-anchor="middle" dominant-baseline="central">K-mer based QC</text>
</g>

<line x1="340" y1="974" x2="340" y2="1008" class="arr" marker-end="url(#arrow)"/>

<!-- FINAL -->
<g class="node c-green">
<rect x="230" y="1008" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1026" text-anchor="middle" dominant-baseline="central">Final Assembly</text>
<text class="ts" x="340" y="1044" text-anchor="middle" dominant-baseline="central">Two haplotype-resolved genomes</text>
</g>

<!-- LEGEND -->
<text class="th" x="40" y="1090" text-anchor="start">Pipeline Steps:</text>
<rect class="c-teal" x="180" y="1082" width="16" height="16" rx="4" stroke-width="0.5"/>
<text class="ts" x="202" y="1094">Data & Preprocessing</text>
<rect class="c-blue" x="350" y="1082" width="16" height="16" rx="4" stroke-width="0.5"/>
<text class="ts" x="372" y="1094">Genome Profiling & QC</text>
<rect class="c-purple" x="520" y="1082" width="16" height="16" rx="4" stroke-width="0.5"/>
<text class="ts" x="542" y="1094">Assembly</text>

</svg>